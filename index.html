<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Piano</title>
  <!-- I've moved the style into the head for better organization -->
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .piano {
      display: flex;
      flex-direction: row;
      border: 9px solid blue;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.7), 0 0 20px rgba(0, 255, 0, 0.7);
      background-color: #000;
      padding: 20px;
    }

    .key {
      padding: 50px;
      border: blue solid 5px;
      text-align: center;
      transition: all 0.07s ease; /* Added a transition for the "playing" effect */
    }

    /* This is the new class we'll add with JavaScript to show a key is being played */
    .playing {
      transform: scale(1.1);
      border-color: #00ff00; /* Neon Green */
      box-shadow: 0 0 15px #00ff00;
    }
  </style>
</head>
<body>
<!-- I've given the main container a more semantic class name 'piano' -->
<div class="piano">
  <!-- The h2 tags are changed to divs for better semantics, with a 'key' class -->
  <div class="key" data-key="65">A</div>
  <div class="key" data-key="83">S</div>
  <div class="key" data-key="68">D</div>
  <div class="key" data-key="70">F</div>
  <div class="key" data-key="71">G</div>
  <div class="key" data-key="72">H</div>
  <div class="key" data-key="74">J</div>
  <div class="key" data-key="75">K</div>
  <div class="key" data-key="76">L</div>
  <div class="key" data-key="186">;</div>
</div>

<!-- The audio elements are the same, no change needed here -->
<audio data-key="65" src="http://carolinegabriel.com/demo/js-keyboard/sounds/040.wav"></audio>
<audio data-key="83" src="http://carolinegabriel.com/demo/js-keyboard/sounds/043.wav"></audio>
<audio data-key="68" src="http://carolinegabriel.com/demo/js-keyboard/sounds/044.wav"></audio>
<audio data-key="70" src="http://carolinegabriel.com/demo/js-keyboard/sounds/045.wav"></audio>
<audio data-key="71" src="http://carolinegabriel.com/demo/js-keyboard/sounds/047.wav"></audio>
<audio data-key="72" src="http://carolinegabriel.com/demo/js-keyboard/sounds/049.wav"></audio>
<audio data-key="74" src="http://carolinegabriel.com/demo/js-keyboard/sounds/051.wav"></audio>
<audio data-key="75" src="http://carolinegabriel.com/demo/js-keyboard/sounds/052.wav"></audio>
<audio data-key="76" src="http://carolinegabriel.com/demo/js-keyboard/sounds/054.wav"></audio>
<audio data-key="186" src="http://carolinegabriel.com/demo/js-keyboard/sounds/056.wav"></audio>

<!-- I've removed jQuery and am using modern "vanilla" JavaScript -->
<script>
  function playSound(e) {
    const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);
    const key = document.querySelector(`.key[data-key="${e.keyCode}"]`);
    
    if (!audio) return; // Stop the function from running if there's no audio for the key

    key.classList.add('playing'); // Add the visual effect
    audio.currentTime = 0; // Rewind to the start
    audio.play();
  }

  function removeTransition(e) {
    if (e.propertyName !== 'transform') return; // Skip it if it's not a transform
    this.classList.remove('playing');
  }

  const keys = document.querySelectorAll('.key');
  keys.forEach(key => key.addEventListener('transitionend', removeTransition));
  
  window.addEventListener('keydown', playSound);
</script>

</body>
</html>
